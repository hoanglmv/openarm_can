[project]
name = "openarm-can"
version = "1.4.0"
description = "OpenArm CAN & Web Dashboard / ROS 2 Joint State Controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "scikit-build-core>=0.9.0",
    "nanobind>=2.0.0",
    "ninja>=1.11.0",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
ros2 = [
    # ROS 2 packages when available in system Python
]

[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
openarm-can = { path = "python", editable = true }
